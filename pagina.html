<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .formulario-caja { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; font-size: 14px; text-align: center; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="formulario-caja">
        <h2>Crear Cuenta</h2>
        <form id="registroForm">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Registrar Usuario</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Evita que la página se recargue

            // Obtener los datos de las cajas de texto
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const divMensaje = document.getElementById('mensaje');

            try {
                // Enviar el JSON a tu servicio de Node.js
                const respuesta = await fetch('http://localhost:3001/api/v1/usuarios/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });

                const datos = await respuesta.json();
                divMensaje.style.display = 'block';

                if (respuesta.ok) {
                    divMensaje.className = 'exito';
                    divMensaje.innerHTML = `✅ ${datos.mensaje}<br><strong>ID generado:</strong> ${datos.datos.id}`;
                    document.getElementById('registroForm').reset(); // Limpiar formulario
                } else {
                    divMensaje.className = 'error';
                    divMensaje.innerHTML = `❌ ${datos.mensaje}`;
                }
            } catch (error) {
                divMensaje.style.display = 'block';
                divMensaje.className = 'error';
                divMensaje.innerHTML = "❌ Error al conectar. Revisa que la terminal en VS Code diga 'Servicio ejecutándose'.";
            }
        });
    </script>
</body>
</html>
